name: Mirror to GitLab

# Pushes the default branch and every tag to the gitlab.com project that serves
# the CI/CD Catalog component (gitlab.com/sitelemetry/audit-action). Tag pushes
# trigger the GitLab release pipeline, which publishes that version to the
# catalog. Requires the repository secret GITLAB_MIRROR_TOKEN: a GitLab project
# access token with the write_repository scope. Without it the job is skipped.

on:
  push:
    branches: [main]
    # Release tags only; the floating v0 tag travels with them (--tags pushes all).
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

# One mirror push at a time: a release pushes main, the version tag and the
# floating tag within seconds, and concurrent force-pushes raced each other.
concurrency:
  group: mirror-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the mirror token
        id: token
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          if [ -z "${GITLAB_MIRROR_TOKEN}" ]; then
            echo "GITLAB_MIRROR_TOKEN is not set; skipping the mirror." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.token.outputs.present == 'true'
        with:
          fetch-depth: 0

      - name: Push main and tags to GitLab
        if: steps.token.outputs.present == 'true'
        env:
          GITLAB_MIRROR_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
        run: |
          git remote add gitlab "https://oauth2:${GITLAB_MIRROR_TOKEN}@gitlab.com/sitelemetry/audit-action.git"
          push() {
            local attempt
            for attempt in 1 2 3; do
              if git push --force gitlab "$@"; then return 0; fi
              echo "push attempt ${attempt} failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            return 1
          }
          push refs/remotes/origin/main:refs/heads/main
          push --tags
          echo "Mirrored main and tags to gitlab.com/sitelemetry/audit-action." >> "$GITHUB_STEP_SUMMARY"
